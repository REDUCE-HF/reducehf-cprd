name: reducehf
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip

  # Workflow orchestration
  - snakemake>=9
  - uv

  # Python analysis (clustering pipeline)
  - numpy=1.26.4
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.12
  - numba=0.62.*
  - llvmlite=0.45.*
  - umap-learn>=0.5
  - pynndescent>=0.5
  - tqdm>=4.60
  - python-dateutil>=2.8
  - pytz
  - tzdata

  # R runtime and diabetes-algo dependencies
  - r-base>=4.0
  - r-arrow
  - r-readr
  - r-here
  - r-lubridate
  - r-dplyr
  - r-tidyr
  - r-optparse
  - r-jsonlite
  - r-r.utils

  - pip:
    - scikit-learn-extra>=0.3
    - gower_exp==0.1.4
